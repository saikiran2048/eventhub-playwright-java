name: Playwright Java Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Playwright's Maven plugin downloads browser binaries the first time
      # any test in the suite runs — no separate "npx playwright install"
      # step needed the way Node projects require.
      - name: Install Playwright browsers
        run: mvn -B exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      - name: Run test suite
        run: mvn -B test -Denv=test -Dheadless=true
        continue-on-error: true

      - name: Ensure allure-results exists
        if: always()
        run: mkdir -p target/allure-results

      - name: Set up Node (for Allure CLI)
        uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '20'

      # Official Allure CLI via npx — avoids the third-party
      # simple-elf/allure-report-action, whose Docker image is missing
      # `xargs` and silently produces no report on some runners.
      - name: Generate Allure report
        if: always()
        run: npx --yes allure-commandline@2.32.0 generate target/allure-results --clean -o allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report

      - name: Upload traces (on failure)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: traces/
          if-no-files-found: ignore